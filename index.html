<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do-List</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap" rel="stylesheet">
</head>
<body>
    
    <h1>TODO APP</h1>
    <div id="wrapper">
        <form>
            <input id="todo-input" type="text" placeholder="Enter task..." autocomplete="off">
            <button id="add-button">ADD</button>
        </form>
        <ul id="todo-list">
            <li class="todo-1" >
                <input type="checkbox" id="todo-1">
                <label class="custom-checkbox" for="todo-1">
                    <img  class="checkBtn" src="images/check-mark.png">
                </label>
                <label for="todo-1" class="todo-text">
                    WebDev Project
                </label>
                <button class="delete-button">
                    <img  src="images/bin.png">
                </button>
            </li>
            <li class="todo-2">
                <input type="checkbox" id="todo-2">
                <label class="custom-checkbox" for="todo-2">
                    <img class="checkBtn" src="images/check-mark.png">
                </label>
                <label for="todo-2" class="todo-text">
                    WebDev Project
                </label>
                <button class="delete-button">
                    <img src="images/bin.png">
                </button>
            </li>
        </ul>
    </div>












    <script src="app.js"></script>
</body>
</html>
